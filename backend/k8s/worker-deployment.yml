apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-worker
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-worker
    app.kubernetes.io/component: background-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-worker
  template:
    metadata:
      labels:
        app: ecommerce-worker
    spec:
      # Allow active background tasks up to 60s to finish after receiving SIGTERM
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: ecommerce-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - bun
            - run
            - src/worker.ts
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Check if the Bun process is still alive and responsive
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - "bun"
            initialDelaySeconds: 10
            periodSeconds: 20